    <section class="contact-wrapper">

 
      <div class="contact-form">
        <h2>Send a Message</h2>

        <form action="mailto:clarencesuligan0609@example.com" method="POST" enctype="text/plain">
          <label>Your Name</label>
          <input type="text" name="Name" placeholder="Enter your full name" required>

          <label>Your Email</label>
          <input type="email" name="Email" placeholder="Enter your email address" required>

          <label>Your Message</label>
          <textarea name="Message" rows="6" placeholder="Write your message..." required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </div>


      <div class="contact-info">
        <h2>Contact</h2>
        <p>Facebook: <a href="https://www.facebook.com/clarence.suligan.7" target="_blank"><b>Clarence Suligan</b></a></p>
        <p>Instagram: <a href="https://www.instagram.com/clarencecence/" target="_blank"><b>Clarence Suligan</b></a></p>
        <p>Phone: <a href="sms:09061248331?body=Hello%20I%20would%20like%20to%20contact%20you."><b>09061248331</b></a></p>

        <p>"Feel free to reach out — I'd love to connect!"</p>
      </div>
